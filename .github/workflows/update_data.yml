name: Daily Dengue Data Update

on:
  schedule:
    - cron: '50 15 * * *' # 換算成 UTC 時間 15:50，即台灣時間 23:50
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: self-hosted
    #runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 numpy xlrd epyestim
          
      - name: Run Update Pipeline
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python update_data.py

      - name: Run Data Merge Pipeline
        run: python merge_data.py
        
      - name: Commit and Push data to branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # 1. 暫存新產生的 CSV (請確保路徑正確，如果是子目錄要改成計入子目錄，如 data/*.csv)
          mkdir -p ../temp_data
          mv *.csv ../temp_data/ 2>/dev/null || true
          
          # 2. 切換到 data-storage 分支
          git fetch origin data-storage
          git checkout data-storage || git checkout -b data-storage origin/data-storage
          
          # 3. 把新資料搬回來覆蓋
          mv ../temp_data/*.csv . 2>/dev/null || true
          
          # 4. 檢查是否有檔案變更，避免被 || exit 0 斷招
          git add *.csv
          if git diff --staged --quiet; then
            echo "--- 沒有偵測到全新資料，跳過 Commit 與 Push ---"
          else
            echo "--- 偵測到新資料，開始更新分支 ---"
            git commit -m "🤖 自動更新資料: $(date +'%Y-%m-%d')"
            git push origin data-storage
          fi
