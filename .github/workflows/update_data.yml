name: Daily Dengue Data Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests urllib3 numpy

      - name: Run Update Pipeline
        run: python update_data.py
        
      - name: Run Test
        env:
          CWA_API_KEY: ${{ secrets.CWA_API_KEY }}
        run: python test.py

      - name: Commit and Push data to branch
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          #把剛抓好的新 CSV 暫時搬到外面，讓工作區變乾淨
          mkdir -p ../temp_data
          mv *.csv ../temp_data/ 2>/dev/null || true
          
          # 更新雲端地圖，切換到資料分支
          git fetch --all
          git checkout data-storage || git checkout -b data-storage
          
          # 把最新鮮的資料搬回來，強行覆蓋掉分支裡的舊資料
          mv ../temp_data/*.csv . 2>/dev/null || true
          
          # 順利提交並推上雲端
          git add *.csv
          git commit -m "🤖 自動更新資料: $(date +'%Y-%m-%d')" || exit 0
          git push origin data-storage
